<div class="app" [attr.data-sidebar-open]="sidebarOpen() ? '' : null">
  <app-sidebar></app-sidebar>
  <div class="sidebar-backdrop" [class.is-visible]="sidebarOpen()" (click)="closeSidebar()"></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="icon-btn menu-toggle-btn"
          aria-label="Toggle navigation"
          [attr.aria-expanded]="sidebarOpen()"
          (click)="toggleSidebar()"
        >
          <app-icon name="menu" />
        </button>

        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <ol>
            <li>Testgen</li>
            <li aria-hidden="true"><app-icon name="chevron-right" size="sm" /></li>
            <li aria-current="page">{{ pageLabel() }}</li>
          </ol>
        </nav>
      </div>

      <div class="topbar-right">
        <span class="project-select">
          <app-icon name="folder" size="sm" />
          <span>Indico, local copy</span>
        </span>
      </div>
    </header>

    <main class="page-container" id="view" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
