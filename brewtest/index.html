<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrewTest</title>
  <meta name="description" content="BrewTest is a software testing workspace for requirements, test cases, suites and simulated executions.">
  <meta name="theme-color" content="#35251F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B98556' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 2v2M14 2v2M6 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/main.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash */
    try {
      var s = JSON.parse(localStorage.getItem('brewtest:v1:settings') || 'null');
      var t = s && s.appearance && s.appearance.theme;
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page-container" id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <noscript><p style="padding:24px">BrewTest needs JavaScript to run.</p></noscript>

  <script src="assets/vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
